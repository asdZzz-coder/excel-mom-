name: Release

# 推送 v* 標籤（例如 v1.0.1）就會自動打包並發佈到 GitHub Releases，
# 已安裝的程式下次開啟時就會偵測到新版本並詢問是否更新（更新檔一樣從 Release 下載）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 自動測試沒過就不發佈
      - name: Test
        run: dotnet test ServiceRecord.Tests/ServiceRecord.Tests.csproj

      # 自帶執行環境（對方電腦不用另外裝 .NET）；不用 ClickOnce，
      # 因為它的 Launcher.exe 會被 Windows「智慧型應用程式控制」擋下
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish ServiceRecord/ServiceRecord.csproj -c Release -r win-x64 --self-contained `
            -p:Version=$version -o package/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip installer
        shell: pwsh
        run: |
          # 安裝包：安裝.cmd + app 資料夾
          Copy-Item -LiteralPath 'installer\安裝.cmd' -Destination 'package\安裝.cmd'
          foreach ($i in 'package\安裝.cmd', 'package\app\ServiceRecord.exe') { if (-not (Test-Path -LiteralPath $i)) { throw "missing $i" } }
          Compress-Archive -Path 'package\*' -DestinationPath ServiceRecord-Setup.zip
          Get-Item ServiceRecord-Setup.zip | Select-Object Name, Length

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "下載 ServiceRecord-Setup.zip，整個解壓縮後執行「安裝.cmd」。已安裝的電腦開啟程式時會詢問是否更新。`n`nDownload ServiceRecord-Setup.zip, extract it, and run 安裝.cmd. Installed copies will offer the update when opened."
          gh release create "${{ github.ref_name }}" ServiceRecord-Setup.zip --title "${{ github.ref_name }}" --notes $notes
